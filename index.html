<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS World Simulator Studio</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #f2f2f7;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Top Studio Header */
        .studio-header {
            width: 100%; max-width: 480px; padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; border-bottom: 1px solid #e5e5ea;
            position: sticky; top: 0; z-index: 1000;
        }
        .studio-title { font-size: 15px; font-weight: 700; }
        .btn-export {
            background: #007aff; color: #fff; border: none;
            padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
        }

        /* 📱 LIVE PHONE (세계관 속 실제 폰) */
        .iphone-frame {
            width: 100%; max-width: 380px; height: 720px;
            margin: 20px 0; border-radius: 44px; border: 10px solid #1c1c1e;
            position: relative; overflow: hidden;
            background-size: cover; background-position: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.2);
        }

        .status-bar {
            position: absolute; top: 0; width: 100%; height: 36px;
            padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; color: #fff; z-index: 500;
        }

        /* Phone Screens */
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
        .screen.active { display: flex; }

        /* Lock Screen */
        #lock-screen {
            justify-content: space-between; align-items: center;
            padding: 60px 20px 40px; text-align: center; color: #fff;
            background-size: cover; background-position: center; cursor: pointer;
        }
        .lock-date { font-size: 17px; font-weight: 500; opacity: 0.9; }
        .lock-time { font-size: 72px; font-weight: 200; letter-spacing: -2px; margin-top: -8px; }

        /* Passcode Keypad */
        #passcode-screen {
            background: rgba(0,0,0,0.75); backdrop-filter: blur(30px);
            color: #fff; justify-content: center; align-items: center; gap: 20px; z-index: 600;
        }
        .pass-dots { display: flex; gap: 14px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #fff; }
        .dot.filled { background: #fff; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 75%; }
        .key {
            width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center; font-size: 24px; margin: auto; cursor: pointer;
        }

        /* Home Screen */
        #home-screen {
            background-size: cover; background-position: center;
            padding: 55px 16px 20px; justify-content: space-between;
        }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 12px; }
        .app-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .app-icon {
            width: 58px; height: 58px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); background-size: cover; background-position: center;
        }
        .app-label { font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .dock {
            height: 84px; background: rgba(255,255,255,0.25); backdrop-filter: blur(20px);
            border-radius: 28px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px;
        }

        /* App Inside Views */
        .app-view {
            position: absolute; inset: 0; background: #fff; color: #000;
            z-index: 700; display: none; flex-direction: column;
        }
        .app-view.active { display: flex; }
        .app-view-header {
            height: 48px; border-bottom: 1px solid #eee; padding: 0 16px;
            display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px;
            margin-top: 25px; background: #fcfcfc;
        }
        .app-view-body { flex: 1; padding: 16px; overflow-y: auto; background: #f2f2f7; }

        /* 🛠️ EDITOR DASHBOARD (하단 제어판) */
        .editor-dashboard {
            width: 100%; max-width: 480px; background: #ffffff;
            border-radius: 24px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .editor-tabs {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #f2f2f7;
        }
        .tab-btn {
            height: 44px; border-radius: 12px; background: #f2f2f7;
            display: flex; justify-content: center; align-items: center; font-size: 18px; cursor: pointer;
        }
        .tab-btn.active { background: #e8f0fe; color: #007aff; }
        .panel { display: none; flex-direction: column; gap: 12px; }
        .panel.active { display: flex; }
        .panel-title { font-size: 15px; font-weight: 700; }
        .f-group { display: flex; flex-direction: column; gap: 4px; }
        .f-group label { font-size: 11px; font-weight: 600; color: #8e8e93; }
        .f-input {
            width: 100%; padding: 10px; border-radius: 10px;
            border: 1px solid #e5e5ea; background: #f9f9fb; font-size: 13px; outline: none;
        }
    </style>
</head>
<body>

    <div class="studio-header">
        <div class="studio-title">세계관 스튜디오 에디터</div>
        <button class="btn-export" onclick="alert('세계관 데이터가 저장되었습니다!')">저장 완료</button>
    </div>

    <!-- 📱 LIVE PHONE -->
    <div class="iphone-frame" id="phone-root">
        <div class="status-bar">
            <span id="st-time">09:41</span>
            <span>􀛨 5G 🔋</span>
        </div>

        <!-- 1. Lock Screen -->
        <div class="screen active" id="lock-screen" onclick="openPasscode()">
            <div>
                <div class="lock-date" id="lk-date">10월 24일 토요일</div>
                <div class="lock-time" id="lk-time">09:41</div>
            </div>
            <div style="font-size: 12px; opacity: 0.8;">화면을 터치하여 잠금해제</div>
        </div>

        <!-- 2. Passcode Screen -->
        <div class="screen" id="passcode-screen">
            <div style="font-size:14px;">비밀번호 입력</div>
            <div class="pass-dots" id="p-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="keypad">
                <div class="key" onclick="pressKey('1')">1</div>
                <div class="key" onclick="pressKey('2')">2</div>
                <div class="key" onclick="pressKey('3')">3</div>
                <div class="key" onclick="pressKey('4')">4</div>
                <div class="key" onclick="pressKey('5')">5</div>
                <div class="key" onclick="pressKey('6')">6</div>
                <div class="key" onclick="pressKey('7')">7</div>
                <div class="key" onclick="pressKey('8')">8</div>
                <div class="key" onclick="pressKey('9')">9</div>
                <div class="key" style="grid-column: 2;" onclick="pressKey('0')">0</div>
            </div>
        </div>

        <!-- 3. Home Screen -->
        <div class="screen" id="home-screen">
            <div class="app-grid" id="main-grid"></div>
            <div class="dock" id="dock-grid"></div>
        </div>

        <!-- 4. Inside App View -->
        <div class="app-view" id="app-view">
            <div class="app-view-header">
                <span style="color:#007aff; cursor:pointer;" onclick="closeApp()">‹ 뒤로</span>
                <span id="app-title">앱</span>
                <span></span>
            </div>
            <div class="app-view-body" id="app-body"></div>
        </div>
    </div>

    <!-- 🛠️ EDITOR DASHBOARD -->
    <div class="editor-dashboard">
        <div class="editor-tabs">
            <div class="tab-btn active" onclick="switchTab(0, 'p-bg')">🖼️</div>
            <div class="tab-btn" onclick="switchTab(1, 'p-icons')">📱</div>
            <div class="tab-btn" onclick="switchTab(2, 'p-apps')">💬</div>
            <div class="tab-btn" onclick="switchTab(3, 'p-notes')">📝</div>
            <div class="tab-btn" onclick="switchTab(4, 'p-cal')">📅</div>
        </div>

        <!-- Tab 0: Backgrounds & Lock -->
        <div class="panel active" id="panel-p-bg">
            <div class="panel-title">배경화면 및 보안</div>
            <div class="f-group"><label>잠금화면 배경 URL</label><input type="text" class="f-input" id="cfg-lock-bg" oninput="sync()"></div>
            <div class="f-group"><label>홈화면 배경 URL</label><input type="text" class="f-input" id="cfg-home-bg" oninput="sync()"></div>
            <div class="f-group"><label>잠금 비밀번호 (4자리)</label><input type="text" class="f-input" id="cfg-pass" maxlength="4" oninput="sync()"></div>
        </div>

        <!-- Tab 1: App Covers -->
        <div class="panel" id="panel-p-icons">
            <div class="panel-title">앱 아이콘(커버) 커스텀</div>
            <div class="f-group"><label>메모 앱 아이콘 (이모지 또는 URL)</label><input type="text" class="f-input" id="icon-memo" oninput="sync()"></div>
            <div class="f-group"><label>사진 앱 아이콘</label><input type="text" class="f-input" id="icon-gallery" oninput="sync()"></div>
            <div class="f-group"><label>카메라 앱 아이콘</label><input type="text" class="f-input" id="icon-camera" oninput="sync()"></div>
            <div class="f-group"><label>캘린더 앱 아이콘</label><input type="text" class="f-input" id="icon-calendar" oninput="sync()"></div>
            <div class="f-group"><label>전화 앱 아이콘 (독)</label><input type="text" class="f-input" id="icon-phone" oninput="sync()"></div>
            <div class="f-group"><label>카카오톡 앱 아이콘 (독)</label><input type="text" class="f-input" id="icon-kakao" oninput="sync()"></div>
            <div class="f-group"><label>음악 앱 아이콘 (독)</label><input type="text" class="f-input" id="icon-music" oninput="sync()"></div>
            <div class="f-group"><label>인터넷 앱 아이콘 (독)</label><input type="text" class="f-input" id="icon-safari" oninput="sync()"></div>
        </div>

        <!-- Tab 2: Kakao & Call -->
        <div class="panel" id="panel-p-apps">
            <div class="panel-title">카카오톡 & 전화 시스템 세팅</div>
            <div class="f-group"><label>카카오톡 상대방 이름</label><input type="text" class="f-input" id="cfg-kakao-name" oninput="sync()"></div>
            <div class="f-group"><label>카카오톡 대화 내용 (줄바꿈 구분)</label><textarea class="f-input" id="cfg-kakao-chat" rows="3" oninput="sync()"></textarea></div>
        </div>

        <!-- Tab 3: Notes & Gallery -->
        <div class="panel" id="panel-p-notes">
            <div class="panel-title">메모장 & 사진 앨범 세팅</div>
            <div class="f-group"><label>메모장 내용</label><textarea class="f-input" id="cfg-memo" rows="3" oninput="sync()"></textarea></div>
            <div class="f-group"><label>사진 앨범 이미지 URL (콤마로 구분)</label><input type="text" class="f-input" id="cfg-photos" oninput="sync()"></div>
        </div>

        <!-- Tab 4: Calendar & Music -->
        <div class="panel" id="panel-p-cal">
            <div class="panel-title">캘린더 & 음악 세팅</div>
            <div class="f-group"><label>캘린더 일정 내용</label><input type="text" class="f-input" id="cfg-cal" oninput="sync()"></div>
            <div class="f-group"><label>음악 플레이어 (곡 제목 / 가수)</label><input type="text" class="f-input" id="cfg-music" oninput="sync()"></div>
        </div>
    </div>

<script>
    let db = JSON.parse(localStorage.getItem('ios_world_db')) || {
        lockBg: 'https://images.unsplash.com/photo-1557683316-973673baf926?w=800',
        homeBg: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800',
        pass: '1234',
        icons: { memo: '📝', gallery: '🖼️', camera: '📷', calendar: '📅', phone: '📞', kakao: '💬', music: '🎵', safari: '🌐' },
        kakaoName: '수빈',
        kakaoChat: '오늘 저녁에 봐!\n응 알겠어 장소로 갈게.',
        memo: '비밀 다이어리:\n1. 오늘 기분 좋음\n2. 내일 약속 있음',
        photos: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500, https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500',
        cal: '12월 5일: 중요한 데이트',
        musicInfo: 'Attention - NewJeans'
    };

    let passInput = '';

    function sync() {
        db.lockBg = document.getElementById('cfg-lock-bg').value;
        db.homeBg = document.getElementById('cfg-home-bg').value;
        db.pass = document.getElementById('cfg-pass').value;
        db.icons.memo = document.getElementById('icon-memo').value;
        db.icons.gallery = document.getElementById('icon-gallery').value;
        db.icons.camera = document.getElementById('icon-camera').value;
        db.icons.calendar = document.getElementById('icon-calendar').value;
        db.icons.phone = document.getElementById('icon-phone').value;
        db.icons.kakao = document.getElementById('icon-kakao').value;
        db.icons.music = document.getElementById('icon-music').value;
        db.icons.safari = document.getElementById('icon-safari').value;
        db.kakaoName = document.getElementById('cfg-kakao-name').value;
        db.kakaoChat = document.getElementById('cfg-kakao-chat').value;
        db.memo = document.getElementById('cfg-memo').value;
        db.photos = document.getElementById('cfg-photos').value;
        db.cal = document.getElementById('cfg-cal').value;
        db.musicInfo = document.getElementById('cfg-music').value;

        localStorage.setItem('ios_world_db', JSON.stringify(db));
        renderPhone();
    }

    function renderPhone() {
        document.getElementById('lock-screen').style.backgroundImage = `url('${db.lockBg}')`;
        document.getElementById('home-screen').style.backgroundImage = `url('${db.homeBg}')`;

        // Main Grid Apps (메모, 사진, 카메라, 캘린더)
        const mainApps = [
            { id: 'memo', name: '메모', icon: db.icons.memo },
            { id: 'gallery', name: '사진', icon: db.icons.gallery },
            { id: 'camera', name: '카메라', icon: db.icons.camera },
            { id: 'calendar', name: '캘린더', icon: db.icons.calendar }
        ];

        // Dock Apps (전화, 카카오톡, 음악, 인터넷)
        const dockApps = [
            { id: 'phone', name: '전화', icon: db.icons.phone },
            { id: 'kakao', name: '카카오톡', icon: db.icons.kakao },
            { id: 'music', name: '음악', icon: db.icons.music },
            { id: 'safari', name: '인터넷', icon: db.icons.safari }
        ];

        const mGrid = document.getElementById('main-grid');
        const dGrid = document.getElementById('dock-grid');
        mGrid.innerHTML = ''; dGrid.innerHTML = '';

        mainApps.forEach(a => mGrid.appendChild(createAppNode(a)));
        dockApps.forEach(a => dGrid.appendChild(createAppNode(a)));
    }

    function createAppNode(app) {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.onclick = () => openApp(app.id);
        const isImg = app.icon.startsWith('http');
        const bgStyle = isImg ? `background-image: url('${app.icon}'); background-size: cover;` : 'background: rgba(255,255,255,0.3); backdrop-filter:blur(10px);';
        const txt = isImg ? '' : app.icon;

        item.innerHTML = `<div class="app-icon" style="${bgStyle}">${txt}</div><div class="app-label">${app.name}</div>`;
        return item;
    }

    function switchTab(idx, panelId) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + panelId).classList.add('active');
    }

    function openPasscode() {
        document.getElementById('lock-screen').classList.remove('active');
        document.getElementById('passcode-screen').classList.add('active');
        passInput = ''; updateDots();
    }

    function pressKey(num) {
        if (passInput.length < 4) {
            passInput += num; updateDots();
            if (passInput.length === 4) {
                setTimeout(() => {
                    if (passInput === db.pass) {
                        document.getElementById('passcode-screen').classList.remove('active');
                        document.getElementById('home-screen').classList.add('active');
                    } else {
                        alert('비밀번호가 틀렸습니다.'); passInput = ''; updateDots();
                    }
                }, 100);
            }
        }
    }

    function updateDots() {
        document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('filled', i < passInput.length));
    }

    // App Real Systems Implementation
    function openApp(id) {
        const view = document.getElementById('app-view');
        const body = document.getElementById('app-body');
        const title = document.getElementById('app-title');

        if (id === 'memo') {
            title.innerText = '메모';
            body.innerHTML = `<textarea style="width:100%; height:100%; border:none; background:transparent; font-size:15px; outline:none;" readonly>${db.memo}</textarea>`;
        } else if (id === 'gallery') {
            title.innerText = '사진';
            const urls = db.photos.split(',');
            body.innerHTML = `<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;">
                ${urls.map(u => `<img src="${u.trim()}" style="width:100%; height:110px; object-fit:cover; border-radius:6px;">`).join('')}
            </div>`;
        } else if (id === 'camera') {
            title.innerText = '카메라';
            body.innerHTML = `<div style="background:#000; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#fff; border-radius:12px;">
                <div style="font-size:40px; margin-bottom:20px;">📷</div>
                <div style="border:4px solid #fff; width:60px; height:60px; border-radius:50%; cursor:pointer;" onclick="alert('찰칵! 사진이 저장되었습니다.')"></div>
            </div>`;
        } else if (id === 'calendar') {
            title.innerText = '캘린더';
            body.innerHTML = `<div style="background:#fff; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.05);">
                <h3 style="color:#ff3b30; margin-bottom:8px;">오늘의 일정</h3>
                <p style="font-size:14px;">${db.cal}</p>
            </div>`;
        } else if (id === 'phone') {
            title.innerText = '전화';
            body.innerHTML = `<div style="text-align:center; padding-top:20px;">
                <div style="font-size:24px; font-weight:600; margin-bottom:20px;" id="dial-num">010-1234-5678</div>
                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; width:80%; margin:auto;">
                    ${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n => `<div style="background:#e5e5ea; padding:15px; border-radius:50%; font-size:18px; font-weight:600; cursor:pointer;" onclick="document.getElementById('dial-num').innerText+='${n}'">${n}</div>`).join('')}
                </div>
            </div>`;
        } else if (id === 'kakao') {
            title.innerText = db.kakaoName;
            body.innerHTML = db.kakaoChat.split('\n').map(t => `
                <div style="background:#fee500; color:#000; padding:10px 14px; border-radius:14px; margin-bottom:8px; max-width:80%; font-size:14px;">${t}</div>
            `).join('');
        } else if (id === 'music') {
            title.innerText = '음악';
            body.innerHTML = `<div style="text-align:center; padding-top:40px;">
                <div style="font-size:60px; margin-bottom:20px;">🎵</div>
                <h3 style="font-size:18px; margin-bottom:10px;">${db.musicInfo}</h3>
                <p style="font-size:13px; color:#8e8e93; margin-bottom:30px;">Apple Music 재생 중</p>
                <div style="font-size:28px; display:flex; justify-content:center; gap:20px; cursor:pointer;">
                    <span>⏮️</span><span onclick="alert('재생/일시정지')">⏸️</span><span>⏭️</span>
                </div>
            </div>`;
        } else if (id === 'safari') {
            title.innerText = '인터넷 (Safari)';
            body.innerHTML = `<div>
                <input type="text" value="https://www.google.com" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; background:#e5e5ea; font-size:13px; text-align:center; margin-bottom:20px;" readonly>
                <div style="text-align:center; padding-top:50px; opacity:0.6;">안전한 브라우징 모드</div>
            </div>`;
        }

        view.classList.add('active');
    }

    function closeApp() {
        document.getElementById('app-view').classList.remove('active');
    }

    // Init Inputs
    document.getElementById('cfg-lock-bg').value = db.lockBg;
    document.getElementById('cfg-home-bg').value = db.homeBg;
    document.getElementById('cfg-pass').value = db.pass;
    document.getElementById('icon-memo').value = db.icons.memo;
    document.getElementById('icon-gallery').value = db.icons.gallery;
    document.getElementById('icon-camera').value = db.icons.camera;
    document.getElementById('icon-calendar').value = db.icons.calendar;
    document.getElementById('icon-phone').value = db.icons.phone;
    document.getElementById('icon-kakao').value = db.icons.kakao;
    document.getElementById('icon-music').value = db.icons.music;
    document.getElementById('icon-safari').value = db.icons.safari;
    document.getElementById('cfg-kakao-name').value = db.kakaoName;
