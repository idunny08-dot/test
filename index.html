<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Phone World Simulator & Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        body {
            background-color: #f2f2f7;
            color: #1c1c1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Top Header Action Bar */
        .top-action-bar {
            position: sticky;
            top: 0;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #e5e5ea;
        }

        .status-info {
            font-size: 12px;
            color: #8e8e93;
        }

        .btn-header {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-save { background: #ffffff; color: #000; border: 1px solid #d1d1d6; }
        .btn-done { background: #1c1c1e; color: #ffffff; }

        /* Phone Screen Preview Area */
        .preview-container {
            width: 100%;
            max-width: 360px;
            height: 640px;
            margin: 15px 0;
            border-radius: 40px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            border: 8px solid #2c2c2e;
            background-size: cover;
            background-position: center;
            background-color: #000;
        }

        /* Status Bar Inside Preview */
        .preview-status {
            position: absolute;
            top: 0;
            width: 100%;
            height: 30px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            z-index: 100;
        }

        /* Preview Screens */
        .p-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding-top: 35px;
        }
        .p-screen.active { display: flex; }

        /* Lockscreen Preview */
        #p-lockscreen {
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px 30px;
            text-align: center;
            cursor: pointer;
        }
        .p-clock-date { font-size: 16px; font-weight: 500; }
        .p-clock-time { font-size: 64px; font-weight: 200; margin-top: -5px; }

        /* Passcode Screen */
        #p-passcode {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            color: #fff;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 90;
        }
        .passcode-dots { display: flex; gap: 12px; margin-bottom: 20px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #fff; }
        .dot.filled { background: #fff; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 80%; }
        .key-btn {
            width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2);
            display: flex; justify-content: center; align-items: center; font-size: 22px; margin: auto;
            cursor: pointer;
        }

        /* Homescreen Preview */
        #p-homescreen {
            padding: 20px 15px;
            justify-content: space-between;
        }
        .p-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .p-app-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: white; }
        .p-app-icon { width: 52px; height: 52px; border-radius: 12px; background: rgba(255,255,255,0.3); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; font-size: 24px; background-size: cover; }
        .p-dock { height: 75px; background: rgba(255,255,255,0.25); backdrop-filter: blur(20px); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }

        /* Internal Apps Preview Views */
        .p-app-view { position: absolute; inset: 0; background: #fff; color: #000; z-index: 200; display: none; flex-direction: column; }
        .p-app-header { height: 44px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-weight: 600; font-size: 14px; background: #f9f9f9; }

        /* Main Editor Section */
        .editor-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Tab Bar Icons (파프리카 디자인 스펙) */
        .editor-tabs {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f2f2f7;
        }
        .tab-item {
            height: 48px;
            border-radius: 14px;
            background: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-item.active {
            background: #e8f0fe;
            color: #1a73e8;
        }

        /* Section Panels */
        .panel { display: none; flex-direction: column; gap: 16px; }
        .panel.active { display: flex; }
        .panel-title { font-size: 18px; font-weight: 700; margin-bottom: 5px; }

        /* Form Controls */
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #6c6c70; }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
            background: #f9f9fb;
            font-size: 14px;
            outline: none;
        }
        .form-control:focus { border-color: #007aff; background: #fff; }

        .list-card {
            border: 1px solid #e5e5ea;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .btn-add {
            background: #1c1c1e; color: #fff; border: none; padding: 10px 16px;
            border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; align-self: flex-start;
        }
    </style>
</head>
<body>

    <!-- Header Action Bar -->
    <div class="top-action-bar">
        <div>
            <div style="font-weight:700; font-size:14px;">편집 중 : <span id="persona-name-tag">가상의 인물</span></div>
            <div class="status-info">이 브라우저에 자동 저장됨</div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn-header btn-save" onclick="saveAllData()">✓ 저장</button>
            <button class="btn-header btn-done" onclick="togglePreviewMode()">미리보기 완료</button>
        </div>
    </div>

    <!-- Phone Simulator Screen Preview -->
    <div class="preview-container" id="preview-phone">
        <div class="preview-status" id="p-status">
            <span id="p-time-top">05:16</span>
            <span>􀛨 5G 🔋</span>
        </div>

        <!-- 1. Lockscreen -->
        <div class="p-screen active" id="p-lockscreen" onclick="showPasscodeScreen()">
            <div>
                <div class="p-clock-date" id="p-lock-date">12월 4일 토요일</div>
                <div class="p-clock-time" id="p-lock-time">오후 5:16</div>
            </div>
            <div style="font-size:12px; opacity:0.8;">위로 쓸어올려 잠금해제</div>
        </div>

        <!-- 2. Passcode Screen -->
        <div class="p-screen" id="p-passcode">
            <div style="font-size:14px; font-weight:500;">암호 입력</div>
            <div class="passcode-dots" id="passcode-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="keypad">
                <div class="key-btn" onclick="pressKey('1')">1</div>
                <div class="key-btn" onclick="pressKey('2')">2</div>
                <div class="key-btn" onclick="pressKey('3')">3</div>
                <div class="key-btn" onclick="pressKey('4')">4</div>
                <div class="key-btn" onclick="pressKey('5')">5</div>
                <div class="key-btn" onclick="pressKey('6')">6</div>
                <div class="key-btn" onclick="pressKey('7')">7</div>
                <div class="key-btn" onclick="pressKey('8')">8</div>
                <div class="key-btn" onclick="pressKey('9')">9</div>
                <div class="key-btn" style="grid-column: 2;" onclick="pressKey('0')">0</div>
            </div>
        </div>

        <!-- 3. Homescreen -->
        <div class="p-screen" id="p-homescreen">
            <div class="p-grid" id="p-app-grid"></div>
            <div class="p-dock" id="p-dock-grid"></div>
        </div>

        <!-- 4. Inside Apps View -->
        <div class="p-app-view" id="p-app-view">
            <div class="p-app-header">
                <span style="color:#007aff; cursor:pointer;" onclick="closeAppView()">‹ 뒤로</span>
                <span id="p-app-title">앱</span>
                <span></span>
            </div>
            <div id="p-app-body" style="padding:15px; overflow-y:auto; flex:1;"></div>
        </div>
    </div>

    <!-- Main Editor Dashboard -->
    <div class="editor-container">
        <!-- Tab Navigation Icons -->
        <div class="editor-tabs">
            <div class="tab-item active" onclick="switchTab(0, 'lockscreen')">🔒</div>
            <div class="tab-item" onclick="switchTab(1, 'homescreen')">▦</div>
            <div class="tab-item" onclick="switchTab(2, 'messages')">💬</div>
            <div class="tab-item" onclick="switchTab(3, 'calendar')">📅</div>
            <div class="tab-item" onclick="switchTab(4, 'settings')">⚙️</div>
        </div>

        <!-- Panel 1: Lockscreen Settings -->
        <div class="panel active" id="panel-lockscreen">
            <div class="panel-title">잠금화면 글자 · 요소</div>
            
            <div class="form-group">
                <label>글자 테마</label>
                <select class="form-control" id="cfg-lock-theme" onchange="updatePreview()">
                    <option value="light">라이트 · 밝은 글자</option>
                    <option value="dark">다크 · 어두운 글자</option>
                </select>
            </div>

            <div class="form-group">
                <label>표시 날짜</label>
                <input type="text" class="form-control" id="cfg-lock-date" value="2021. 12. 4." oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>표시 시간</label>
                <input type="text" class="form-control" id="cfg-lock-time" value="오후 5:16" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>잠금 비밀번호 (4자리)</label>
                <input type="text" class="form-control" id="cfg-lock-pass" value="8658" maxlength="4" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>잠금화면 배경 이미지 URL</label>
                <input type="text" class="form-control" id="cfg-lock-bg" value="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" oninput="updatePreview()">
            </div>
        </div>

        <!-- Panel 2: Homescreen & Apps -->
        <div class="panel" id="panel-homescreen">
            <div class="panel-title">홈화면 & 배경 설정</div>
            <div class="form-group">
                <label>홈화면 배경 이미지 URL</label>
                <input type="text" class="form-control" id="cfg-home-bg" value="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800" oninput="updatePreview()">
            </div>
            
            <div class="panel-title" style="margin-top:15px;">등록된 앱 목록</div>
            <div id="app-editor-list"></div>
            <button class="btn-add" onclick="addNewApp()">+ 새 앱 추가</button>
        </div>

        <!-- Panel 3: Message Threads -->
        <div class="panel" id="panel-messages">
            <div class="panel-title">메시지 설정</div>
            <button class="btn-add" onclick="addMessageThread()">+ 대화 만들기</button>
            <div id="message-editor-list" style="margin-top:15px;"></div>
        </div>

        <!-- Panel 4: Calendar Events -->
        <div class="panel" id="panel-calendar">
            <div class="panel-title">캘린더 일정</div>
            <button class="btn-add" onclick="addCalendarEvent()">+ 일정 추가</button>
            <div id="calendar-editor-list" style="margin-top:15px;"></div>
        </div>

        <!-- Panel 5: Persona Settings -->
        <div class="panel" id="panel-settings">
            <div class="panel-title">폰 주인 페르소나 설정</div>
            <div class="form-group">
                <label>이름</label>
                <input type="text" class="form-control" id="cfg-persona-name" value="이수빈" oninput="updatePreview()">
            </div>
            <div class="form-group">
                <label>상태 메시지 / 메모</label>
                <input type="text" class="form-control" id="cfg-persona-status" value="프러포즈 준비 중..." oninput="updatePreview()">
            </div>
        </div>
    </div>

<script>
    // State Data
    let store = JSON.parse(localStorage.getItem('persona_phone_db')) || {
        lockTheme: 'light',
        lockDate: '2021. 12. 4.',
        lockTime: '오후 5:16',
        lockPass: '8658',
        lockBg: 'https://images.unsplash.com/photo-1557683316-973673baf926?w=800',
        homeBg: 'https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=800',
        personaName: '이수빈',
        personaStatus: '프러포즈 준비 중...',
        apps: [
            { id: 1, name: '메시지', icon: '💬', type: 'msg' },
            { id: 2, name: '캘린더', icon: '📅', type: 'cal' },
            { id: 3, name: '메모장', icon: '📝', type: 'note', content: '12월 5일 장소 예약 완료.' }
        ],
        messages: [
            { id: 1, sender: '민우', text: '프러포즈 반지 준비는 다 됐어?' }
        ],
        events: [
            { id: 1, title: '수빈이한테 프러포즈', date: '2021년 12월 5일' }
        ]
    };

    let enteredPasscode = "";

    function saveAllData() {
        localStorage.setItem('persona_phone_db', JSON.stringify(store));
        alert('모든 설정이 성공적으로 저장되었습니다!');
    }

    function switchTab(idx, panelId) {
        document.querySelectorAll('.tab-item').forEach((t, i) => t.classList.toggle('active', i === idx));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + panelId).classList.add('active');
    }

    function updatePreview() {
        // Load Form Values into Store
        store.lockTheme = document.getElementById('cfg-lock-theme').value;
        store.lockDate = document.getElementById('cfg-lock-date').value;
        store.lockTime = document.getElementById('cfg-lock-time').value;
        store.lockPass = document.getElementById('cfg-lock-pass').value;
        store.lockBg = document.getElementById('cfg-lock-bg').value;
        store.homeBg = document.getElementById('cfg-home-bg').value;
        store.personaName = document.getElementById('cfg-persona-name').value;
        store.personaStatus = document.getElementById('cfg-persona-status').value;

        document.getElementById('persona-name-tag').innerText = store.personaName;

        // Apply Lockscreen
        const lockscreen = document.getElementById('p-lockscreen');
        lockscreen.style.backgroundImage = `url('${store.lockBg}')`;
        lockscreen.style.color = store.lockTheme === 'dark' ? '#000' : '#fff';
        document.getElementById('p-lock-date').innerText = store.lockDate;
        document.getElementById('p-lock-time').innerText = store.lockTime;
        document.getElementById('p-time-top').innerText = store.lockTime.replace('오후 ', '').replace('오전 ', '');

        // Apply Homescreen
        const previewPhone = document.getElementById('preview-phone');
        document.getElementById('p-homescreen').style.backgroundImage = `url('${store.homeBg}')`;

        // Render Apps
        const grid = document.getElementById('p-app-grid');
        grid.innerHTML = '';
        store.apps.forEach(app => {
            const item = document.createElement('div');
            item.className = 'p-app-item';
            item.innerHTML = `<div class="p-app-icon">${app.icon}</div><div>${app.name}</div>`;
            item.onclick = () => openAppView(app);
            grid.appendChild(item);
        });

        renderAppEditors();
        renderMessageEditors();
        renderCalendarEditors();
    }

    // Passcode Logic
    function showPasscodeScreen() {
        document.getElementById('p-lockscreen').classList.remove('active');
        document.getElementById('p-passcode').classList.add('active');
        enteredPasscode = "";
        updateDots();
    }

    function pressKey(num) {
        if (enteredPasscode.length < 4) {
            enteredPasscode += num;
            updateDots();
            if (enteredPasscode.length === 4) {
                setTimeout(() => {
                    if (enteredPasscode === store.lockPass) {
                        document.getElementById('p-passcode').classList.remove('active');
                        document.getElementById('p-homescreen').classList.add('active');
                    } else {
                        alert('비밀번호가 올바르지 않습니다.');
                        enteredPasscode = "";
                        updateDots();
                    }
                }, 100);
            }
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, i) => {
            dot.classList.toggle('filled', i < enteredPasscode.length);
        });
    }

    // App Open View
    function openAppView(app) {
        const view = document.getElementById('p-app-view');
        const body = document.getElementById('p-app-body');
        document.getElementById('p-app-title').innerText = app.name;

        if (app.type === 'msg') {
            body.innerHTML = store.messages.map(m => `
                <div style="background:#e9e9eb; padding:10px 14px; border-radius:16px; margin-bottom:8px; max-width:80%;">
                    <div style="font-size:11px; color:#8e8e93; font-weight:600;">${m.sender}</div>
                    <div style="font-size:13px; margin-top:2px;">${m.text}</div>
                </div>
            `).join('');
        } else if (app.type === 'cal') {
            body.innerHTML = store.events.map(e => `
                <div style="border-left:3px solid #007aff; padding-left:10px; margin-bottom:12px;">
                    <div style="font-weight:600; font-size:14px;">${e.title}</div>
                    <div style="font-size:12px; color:#8e8e93;">${e.date}</div>
                </div>
            `).join('');
        } else {
            body.innerHTML = `<p style="font-size:13px; line-height:1.5;">${app.content || '내용이 없습니다.'}</p>`;
        }

        view.style.display = 'flex';
    }

    function closeAppView() {
        document.getElementById('p-app-view').style.display = 'none';
    }

    // Dynamic Lists Editors
    function renderAppEditors() {
        const list = document.getElementById('app-editor-list');
        list.innerHTML = store.apps.map((app, idx) => `
            <div class="list-card">
                <span>${app.icon} ${app.name}</span>
                <button onclick="removeApp(${idx})" style="background:none; border:none; color:red; cursor:pointer;">삭제</button>
            </div>
        `).join('');
    }

    function addNewApp() {
        const name = prompt('앱 이름:', '새 앱');
        const icon = prompt('아이콘 (이모지):', '📱');
        if (name && icon) {
            store.apps.push({ id: Date.now(), name, icon, type: 'note', content: '' });
            updatePreview();
        }
    }

    function removeApp(idx) {
        store.apps.splice(idx, 1);
        updatePreview();
    }

    function renderMessageEditors() {
        const list = document.getElementById('message-editor-list');
        list.innerHTML = store.messages.map((m, idx) => `
            <div class="list-card">
                <div>
                    <strong>${m.sender}</strong>: ${m.text}
                </div>
                <button onclick="removeMessage(${idx})" style="background:none; border:none; color:red; cursor:pointer;">삭제</button>
            </div>
        `).join('');
    }

    function addMessageThread() {
        const sender = prompt('상대방 이름:', '친구');
        const text = prompt('메시지 내용:', '안녕!');
        if (sender && text) {
            store.messages.push({ id: Date.now(), sender, text });
            updatePreview();
        }
    }

    function removeMessage(idx) {
        store.messages.splice(idx, 1);
        updatePreview();
    }

    function renderCalendarEditors() {
        const list = document.getElementById('calendar-editor-list');
        list.innerHTML = store.events.map((e, idx) => `
            <div class="list-card">
                <div>
                    <strong>${e.title}</strong> (${e.date})
                </div>
                <button onclick="removeEvent(${idx})" style="background:none; border:none; color:red; cursor:pointer;">삭제</button>
            </div>
        `).join('');
    }

    function addCalendarEvent() {
        const title = prompt('일정 이름:', '약속');
        const date = prompt('날짜:', '2021년 12월 5일');
        if (title && date) {
            store.events.push({ id: Date.now(), title, date });
            updatePreview();
        }
    }

    function removeEvent(idx) {
        store.events.splice(idx, 1);
        updatePreview();
    }

    function togglePreviewMode() {
        alert('미리보기 모드: 상단 폰 화면에서 잠금화면 클릭 후 암호를 입력해보세요!');
    }

    // Init Values on Load
    document.getElementById('cfg-lock-theme').value = store.lockTheme;
    document.getElementById('cfg-lock-date').value = store.lockDate;
    document.getElementById('cfg-lock-time').value = store.lockTime;
    document.getElementById('cfg-lock-pass').value = store.lockPass;
    document.getElementById('cfg-lock-bg').value = store.lockBg;
    document.getElementById('cfg-home-bg').value = store.homeBg;
    document.getElementById('cfg-persona-name').value = store.personaName;
    document.getElementById('cfg-persona-status').value = store.personaStatus;

    updatePreview();
</script>
</body>
</html>
